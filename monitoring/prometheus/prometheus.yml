global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'novastore-ecommerce-monitor'

# Alerting Rules (Optional placeholder configuration)
alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ==========================================
  # Scrape Target: NovaStore Backend API
  # ==========================================
  - job_name: 'ecommerce-backend'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000', 'localhost:5000', 'host.docker.internal:5000']
        labels:
          service: 'ecommerce-backend'
          environment: 'production'

  # ==========================================
  # Scrape Target: Prometheus self-metrics
  # ==========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
