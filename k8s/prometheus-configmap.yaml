apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: office-management
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'office-backend'
        metrics_path: '/api/metrics'
        scrape_interval: 5s
        static_configs:
          - targets: ['backend-service:5000']
            labels:
              app: 'office-backend'
              env: 'kubernetes'
