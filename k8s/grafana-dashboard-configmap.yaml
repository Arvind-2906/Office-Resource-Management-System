apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: office-management
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: office-management
  labels:
    app: grafana
data:
  orms-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Total HTTP Requests",
          "type": "stat",
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "sum(office_http_requests_total)",
              "legendFormat": "Requests",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Node.js Heap Memory (MB)",
          "type": "stat",
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "office_nodejs_heap_size_used_bytes / (1024 * 1024)",
              "legendFormat": "Memory Used",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": { "unit": "decmbytes" }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "Active Handles & Sockets",
          "type": "stat",
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "office_nodejs_active_handles_total",
              "legendFormat": "Handles",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "HTTP Errors (4xx & 5xx)",
          "type": "stat",
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "sum(office_http_requests_total{status_code=~\"4..|5..\"}) or vector(0)",
              "legendFormat": "Errors",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "title": "API Request Throughput by Route (req/sec)",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(office_http_requests_total[1m])) by (route, status_code)",
              "legendFormat": "{{route}} [{{status_code}}]",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "title": "HTTP Request Duration / Latency (p95)",
          "type": "timeseries",
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(office_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "95th Percentile Latency",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["office-resource-management", "devops"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Office Resource Management - System Overview",
      "uid": "orms-system-overview",
      "version": 1
    }
