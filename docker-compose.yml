services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: arvindpatil/office-backend:latest
    container_name: office_resource_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb+srv://arvindpatil9206_db_user:UyN82HakA8VMbHs2@cluster0.6r4lbcg.mongodb.net/office_resource_db?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-Rq^Qo84(^h6b1i>D|2jD,5Rvbt.{?he]mdyeyc9z-H=}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - office-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    image: arvindpatil/office-frontend:latest
    container_name: office_resource_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - office-network

networks:
  office-network:
    driver: bridge
