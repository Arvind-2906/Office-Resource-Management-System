version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce_db
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - ecommerce-dev-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: ecommerce-backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/ecommerce_db
      JWT_SECRET: super_secret_jwt_key_at_least_32_characters_long_for_security
      CLIENT_URL: http://localhost:5173
    command: sh -c "npm install && npm run dev"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecommerce-dev-network

  frontend:
    image: node:20-alpine
    container_name: ecommerce-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - ecommerce-dev-network

volumes:
  mongodb_data_dev:

networks:
  ecommerce-dev-network:
    driver: bridge
