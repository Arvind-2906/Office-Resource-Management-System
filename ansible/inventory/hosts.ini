# ==========================================
# Ansible Inventory Configuration
# Replace placeholder IPs/hosts with target server addresses
# ==========================================

[webservers]
prod-web-01 ansible_host=192.0.2.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
prod-web-02 ansible_host=192.0.2.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[dbservers]
prod-db-01 ansible_host=192.0.2.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_root_dir=/opt/novastore
app_env=production
