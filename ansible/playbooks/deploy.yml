---
- name: Deploy NovaStore E-Commerce Stack
  hosts: webservers
  become: false
  vars:
    app_dir: /opt/novastore

  tasks:
    - name: Copy docker-compose.yml to remote host
      copy:
        src: ../../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Ensure production environment file is configured
      copy:
        dest: "{{ app_dir }}/.env"
        content: |
          PORT=5000
          NODE_ENV=production
          MONGO_URI=mongodb://mongodb:27017/ecommerce_db
          JWT_SECRET={{ lookup('env', 'JWT_SECRET') | default('super_secret_jwt_key_at_least_32_characters_long_for_security', true) }}
          CLIENT_URL=http://localhost
        mode: '0600'

    - name: Pull latest container images
      command: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Start or update services via Docker Compose
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for backend health check to report UP
      uri:
        url: http://localhost:5000/api/health
        status_code: 200
        return_content: yes
      register: health_check
      until: health_check.status == 200 and (health_check.json.status == "UP" or "UP" in health_check.content)
      retries: 12
      delay: 5

    - name: Verify application readiness probe
      uri:
        url: http://localhost:5000/api/health/ready
        status_code: 200
      register: ready_check
      until: ready_check.status == 200
      retries: 10
      delay: 3

    - name: Deployment Success Notification
      debug:
        msg: "NovaStore successfully deployed and verified healthy at {{ inventory_hostname }}!"
